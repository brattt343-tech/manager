<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مديري الشخصي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5f2;--card:#fff;--tx:#17231f;--mut:#667570;--bd:#dde3df;--ac:#0f766e;--ok:#2f9e5b;--warn:#d98a0b;--bad:#d03a2f;--soft:#e4efec;--work:#e8e8ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--card:#18221f;--tx:#e8efec;--mut:#93a39d;--bd:#2a3733;--ac:#3cc4b6;--ok:#4cc07f;--warn:#f0b13c;--bad:#f06b5f;--soft:#1f3030;--work:#2a2f33}}
:root[data-theme="dark"]{--bg:#101715;--card:#18221f;--tx:#e8efec;--mut:#93a39d;--bd:#2a3733;--ac:#3cc4b6;--ok:#4cc07f;--warn:#f0b13c;--bad:#f06b5f;--soft:#1f3030;--work:#2a2f33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
#main{max-width:860px;margin:0 auto;padding:12px 14px 110px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 14px;min-height:44px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.d{color:var(--bad)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;min-height:44px}
textarea{min-height:76px}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
small{color:var(--mut);display:block}
h3{margin:0 0 8px;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.dbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dbar b{flex:1;text-align:center;font-size:17px}
.hero{display:flex;gap:16px;align-items:center}
.big{font-size:44px;font-weight:700;color:var(--ac);min-width:96px;text-align:center}
.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.bl{display:flex;justify-content:space-between;font-size:14px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row.done .ti b{text-decoration:line-through;color:var(--mut)}
.row.cancelled{opacity:.6}
.chk{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;flex:none;margin-top:2px}
.row.done .chk{background:var(--ok);color:#fff;border-color:var(--ok)}
.ti{flex:1;cursor:pointer}
.tg{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--soft);margin:3px 0 0 4px}
.sub{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:4px}
.sub input{width:20px;min-height:20px;height:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btns button{flex:1;min-width:70px}
nav{position:fixed;bottom:0;right:0;left:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;padding:8px 2px;min-height:58px;color:var(--mut)}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.wk button{padding:6px 0;font-size:12px;text-align:center;min-height:60px}
.wk button.on,.cell.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cell{min-height:56px;font-size:13px;padding:4px 0;text-align:center}
.tl{position:relative;height:1200px;margin-top:10px}
.hl{position:absolute;right:0;left:0;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
.blk{position:absolute;right:50px;left:4px;border-radius:10px;padding:2px 8px;font-size:13px;overflow:hidden;background:var(--soft);border:2px solid var(--ac);cursor:pointer}
.blk.w{background:var(--work);border-color:var(--bd);cursor:default;color:var(--mut)}
.blk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.blk.doing{border-color:var(--warn)}
.blk.bad{border-color:var(--bad);border-style:dashed}
.now{position:absolute;right:48px;left:0;border-top:2px solid var(--bad)}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.pr b{flex:1}
.st0{color:var(--mut)}.stontime{background:var(--ok);color:#fff}.stlate{background:var(--warn);color:#fff}.stmissed{background:var(--bad);color:#fff}
.sm{font-size:14px}
a{color:var(--ac)}
</style>
</head>
<body>
<div id="main"></div>
<nav>
<button data-v="today" onclick="go('today')"><span>🏠</span>اليوم</button>
<button data-v="tasks" onclick="go('tasks')"><span>✅</span>المهام</button>
<button data-v="time" onclick="go('time')"><span>🕒</span>الجدول</button>
<button data-v="worship" onclick="go('worship')"><span>🕌</span>العبادات</button>
<button data-v="health" onclick="go('health')"><span>💧</span>الصحة</button>
</nav>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF={quran:20,water:2500,tas:100,ist:100,ex:30};
let S={tasks:[],days:{},ideas:[],set:Object.assign({},DEF)};
try{const r=localStorage.getItem('mgr1');if(r){const j=JSON.parse(r);S=Object.assign(S,j);S.set=Object.assign({},DEF,j.set)}}catch(e){}
const save=()=>{try{localStorage.setItem('mgr1',JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>new Date(s+'T00:00:00');
const TODAY=()=>iso(new Date());
const addD=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const mk=()=>({pr:{},q:0,ad:{m:0,e:0,w:0,d:0,tas:0,ist:0},w:0,walk:0,run:0,note:''});
const D=k=>S.days[k]||(S.days[k]=mk());
const pk=k=>S.days[k]||mk();
const PR={urgent:['عاجلة','#d03a2f'],important:['مهمة','#d98a0b'],normal:['عادية','#2e7cd6'],low:['منخفضة الأولوية','#8a97a0']};
const ST={todo:'لم تبدأ',doing:'قيد التنفيذ',done:'مكتملة',cancelled:'ملغاة'};
const CT={personal:'شخصي',study:'دراسة',health:'صحة',family:'عائلة',appt:'مواعيد'};
const PRS=[['fajr','الفجر'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء']];
const PSL={ontime:'في وقتها ✓',late:'متأخرة',missed:'فاتتني'};
const mins=t=>{if(!t)return null;const a=t.split(':');return +a[0]*60+ +a[1]};
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const onDay=(t,k)=>t.d1&&t.d1<=k&&k<=(t.d2||t.d1);
const open_=t=>t.st==='todo'||t.st==='doing';
const overdue=t=>t.d1&&(t.d2||t.d1)<TODAY()&&open_(t);
const dayTasks=k=>S.tasks.filter(t=>onDay(t,k)).sort((a,b)=>(mins(a.t1)==null?9999:mins(a.t1))-(mins(b.t1)==null?9999:mins(b.t1)));
const fmt=(k,o)=>parse(k).toLocaleDateString('ar-u-ca-gregory-nu-latn',o);
const weekStart=k=>addD(k,-((parse(k).getDay()+1)%7));
let view='today',sel=TODAY(),tl='day',mo=TODAY().slice(0,8)+'01';

function score(k){
 const d=pk(k),g={};
 const ts=dayTasks(k).filter(t=>t.st!=='cancelled');
 if(ts.length)g.tasks=ts.filter(t=>t.st==='done').length/ts.length;
 const prs=PRS.reduce((a,p)=>a+({ontime:1,late:.5}[d.pr[p[0]]]||0),0)/5;
 const q=Math.min(1,d.q/S.set.quran),A=d.ad;
 const ad=([A.m,A.e,A.w,A.d].reduce((a,x)=>a+(x?1:0),0)+Math.min(1,A.tas/S.set.tas)+Math.min(1,A.ist/S.set.ist))/6;
 g.worship=(prs+q+ad)/3;
 g.health=(Math.min(1,d.w/S.set.water)+Math.min(1,(d.walk+d.run)/S.set.ex))/2;
 const v=Object.keys(g).map(x=>g[x]);
 return{g:g,tot:v.reduce((a,b)=>a+b,0)/v.length,prs:prs,q:q,ad:ad};
}
const lab=p=>p>=.85?'ممتاز 🌟':p>=.7?'جيد جدًا 😊':p>=.5?'جيد 🙂':'يحتاج إلى تحسين';
const bar=(p,t,c)=>`<div class="bl"><span>${t}</span><span>${Math.round(Math.min(1,p)*100)}%</span></div><div class="bar"><i style="width:${Math.min(1,p)*100}%${c?';background:'+c:''}"></i></div>`;
const GN={tasks:'المهام',worship:'العبادات',health:'الصحة والعادات'};

function go(v){view=v;render()}
function setSel(k){sel=k;render()}
function render(){
 $('#main').innerHTML=dateBar()+({today:vToday,tasks:vTasks,time:vTime,worship:vWorship,health:vHealth})[view]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}
function dateBar(){
 return `<div class="dbar"><button onclick="setSel(addD(sel,1))" aria-label="اليوم التالي">▶</button><b>${fmt(sel,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b><button onclick="setSel(addD(sel,-1))" aria-label="اليوم السابق">◀</button>${sel!==TODAY()?'<button class="p" onclick="setSel(TODAY())">اليوم</button>':''}</div>`;
}
function taskRow(t){
 const pl=mins(t.t2)-mins(t.t1),ac=mins(t.a2)-mins(t.a1);
 const tm=t.t1?`<span class="tg">${t.t1}${t.t2?'–'+t.t2:''}</span>`:'';
 const pa=(pl>0&&ac>0)?`<span class="tg">مخطط ${pl}د / فعلي ${ac}د</span>`:'';
 const subs=(t.subs||[]).map((s,i)=>`<label class="sub" style="margin:4px 0 0;color:inherit"><input type="checkbox" ${s.done?'checked':''} onchange="subTog('${t.id}',${i})">${esc(s.t)}</label>`).join('');
 const lk=/^https?:\/\//.test(t.link||'')?` <a href="${esc(t.link)}" target="_blank" rel="noopener">🔗</a>`:'';
 return `<div class="row ${t.st}"><button class="chk" onclick="tog('${t.id}')" aria-label="إنجاز">${t.st==='done'?'✓':''}</button><div class="ti"><div onclick="openTask('${t.id}')"><b>${esc(t.title)}</b>${lk}<div><span class="tg" style="background:${PR[t.pr][1]};color:#fff">${PR[t.pr][0]}</span><span class="tg">${CT[t.ct]}</span><span class="tg">${ST[t.st]}</span>${tm}${pa}${t.d1&&t.d1!==sel?`<span class="tg">${t.d1}${t.d2&&t.d2!==t.d1?' ← '+t.d2:''}</span>`:''}</div></div>${subs}${t.st==='cancelled'&&t.why?`<small>سبب الإلغاء: ${esc(t.why)}</small>`:''}</div></div>`;
}
function list(arr,empty){return arr.length?arr.map(taskRow).join(''):`<small>${empty}</small>`}
function prayRow(){
 return PRS.map(p=>{const s=pk(sel).pr[p[0]]||'';return `<div class="pr"><b>${p[1]}</b>${s?`<small>${pk(sel).pr[p[0]+'_t']||''}</small>`:''}<button class="${s?'st'+s:'st0'}" style="min-width:110px" onclick="pray('${p[0]}')">${PSL[s]||'لم تُسجَّل'}</button></div>`}).join('');
}

function vToday(){
 const k=sel,s=score(k),ts=dayTasks(k).filter(t=>t.st!=='cancelled');
 const od=S.tasks.filter(overdue),ug=S.tasks.filter(t=>t.pr==='urgent'&&open_(t)&&!overdue(t));
 const up=S.tasks.filter(t=>t.d1>k&&open_(t)).sort((a,b)=>a.d1.localeCompare(b.d1)).slice(0,5);
 const gb=Object.keys(s.g).map(x=>bar(s.g[x],GN[x])).join('');
 return `<div class="card hero"><div class="big">${Math.round(s.tot*100)}%</div><div><b style="font-size:20px">${lab(s.tot)}</b><small>التقييم اليومي التلقائي (المهام، العبادات، الصحة)</small></div></div>
 <div class="card">${gb}</div>
 <div class="card"><h3>إضافة سريعة</h3><input id="qa" placeholder="اكتب مهمة أو فكرة..."><div class="btns"><button class="p" onclick="qAdd('today')">مهمة لهذا اليوم</button><button onclick="qAdd('future')">مهمة مستقبلية</button><button onclick="qAdd('idea')">فكرة</button></div></div>
 ${od.length||ug.length?`<div class="card" style="border-color:var(--bad)"><h3>عاجلة ومتأخرة</h3>${list(od.concat(ug),'')}</div>`:''}
 <div class="card"><h3>جدول اليوم</h3>${list(ts,'لا توجد مهام لهذا اليوم.')}<div class="btns"><button onclick="openTask()">+ مهمة جديدة</button></div></div>
 <div class="card"><h3>الصلوات</h3>${prayRow()}</div>
 <div class="card"><h3>المواعيد والمهام القادمة</h3>${list(up,'لا شيء قادم.')}</div>
 ${S.ideas.length?`<div class="card"><h3>الأفكار السريعة</h3>${S.ideas.map(i=>`<div class="row"><div class="ti">${esc(i.text)}<div class="btns"><button onclick="ideaTo('${i.id}','today')">إلى مهمة اليوم</button><button onclick="ideaTo('${i.id}','future')">إلى قائمة مستقبلية</button><button class="d" onclick="ideaDel('${i.id}')">حذف</button></div></div></div>`).join('')}</div>`:''}
 <div class="card"><h3>ملاحظات اليوم</h3><small>لماذا لم أنجز؟ ما الذي منعني؟ هل كان اليوم أفضل من المتوقع؟</small><textarea onchange="D(sel).note=this.value;save()">${esc(pk(k).note)}</textarea></div>`;
}
function vTasks(){
 const T=TODAY(),all=S.tasks;
 return `<div class="btns" style="margin-top:0"><button class="p" onclick="openTask()">+ مهمة جديدة</button></div><div style="height:12px"></div>
 <div class="card"><h3>متأخرة</h3>${list(all.filter(overdue),'لا توجد مهام متأخرة 👍')}</div>
 <div class="card"><h3>اليوم</h3>${list(dayTasks(T).filter(t=>t.st!=='cancelled'),'لا مهام اليوم.')}</div>
 <div class="card"><h3>قادمة</h3>${list(all.filter(t=>t.d1>T&&open_(t)).sort((a,b)=>a.d1.localeCompare(b.d1)),'لا مهام قادمة.')}</div>
 <div class="card"><h3>مستقبلية (بدون موعد)</h3>${list(all.filter(t=>!t.d1&&t.st!=='cancelled'),'القائمة فارغة.')}</div>
 <div class="card"><h3>سجل الملغاة</h3>${list(all.filter(t=>t.st==='cancelled'),'لا توجد مهام ملغاة.')}</div>`;
}
function items(k){
 const it=[];
 if(parse(k).getDay()<=4)it.push({w:1,s:300,e:870,title:'الدوام 05:00–14:30'});
 dayTasks(k).filter(t=>t.st!=='cancelled'&&mins(t.t1)!=null).forEach(t=>{const s=mins(t.t1);let e=mins(t.t2);if(e==null||e<=s)e=s+30;it.push({t:t,s:s,e:Math.min(e,1440),title:t.title})});
 return it;
}
const ov=(a,b)=>a.s<b.e&&b.s<a.e;
function freeSlot(it,self){
 const d=self.e-self.s,bz=it.filter(x=>x!==self);
 for(let s=360;s+d<=1380;s+=15){const c={s:s,e:s+d};if(!bz.some(x=>ov(x,c)))return s}
 return null;
}
function vTime(){
 const ws=weekStart(sel);let wk='',sum=0,cnt=0;
 for(let i=0;i<7;i++){const k=addD(ws,i),past=k<=TODAY(),sc=past?Math.round(score(k).tot*100):null;if(past){sum+=sc;cnt++}
  wk+=`<button class="${k===sel?'on':''}" onclick="sel='${k}';tl='day';render()">${fmt(k,{weekday:'short'})}<br>${parse(k).getDate()}<br>${sc==null?'':sc+'%'}</button>`}
 const tabs=`<div class="btns" style="margin:0 0 10px"><button class="${tl==='day'?'p':''}" onclick="tl='day';render()">اليوم</button><button class="${tl==='month'?'p':''}" onclick="tl='month';render()">الشهر</button><button onclick="openTask()">+ مهمة</button></div>`;
 const head=`${tabs}<div class="wk">${wk}</div>${cnt?`<small style="margin-bottom:8px">متوسط الإنجاز هذا الأسبوع: ${Math.round(sum/cnt)}%</small>`:''}`;
 if(tl==='month')return head+month();
 const it=items(sel),tk=it.filter(x=>x.t),bad=tk.filter(a=>it.some(b=>b!==a&&ov(a,b)));
 let cf='';
 if(bad.length)cf=`<div class="card" style="border-color:var(--bad)"><h3>تعارضات</h3>${bad.map(a=>{const f=freeSlot(it,a);return `<div class="row"><div class="ti"><b>${esc(a.title)}</b> ${hm(a.s)}–${hm(a.e)}${f==null?'<small>لا يوجد وقت بديل في هذا اليوم.</small>':`<small>وقت بديل مقترح: ${hm(f)}–${hm(f+a.e-a.s)}</small><div class="btns"><button class="p" onclick="moveTask('${a.t.id}',${f},${f+a.e-a.s})">انقل إلى الوقت المقترح</button></div>`}</div></div>`}).join('')}</div>`;
 let h='';
 for(let i=0;i<=24;i++)h+=`<div class="hl" style="top:${i*50}px"><span style="position:absolute;right:0;top:-10px;background:var(--bg);padding:0 2px">${hm(i*60)}${i===24?'':''}</span></div>`;
 const blocks=it.map(x=>`<div class="blk ${x.w?'w':(x.t.st||'')} ${bad.includes(x)?'bad':''}" style="top:${x.s/60*50}px;height:${Math.max((x.e-x.s)/60*50,24)}px" ${x.t?`onclick="openTask('${x.t.id}')"`:''}><b>${esc(x.title)}</b> ${x.w?'':hm(x.s)+'–'+hm(x.e)}</div>`).join('');
 const now=sel===TODAY()?(n=>`<div class="now" style="top:${(n.getHours()*60+n.getMinutes())/60*50}px"></div>`)(new Date()):'';
 return head+cf+`<small>الساعة 12:00 منتصف الليل حتى 12:00 منتصف الليل التالي. اضغط على المهمة لتعديلها.</small><div class="tl">${h}${blocks}${now}</div>`;
}
function month(){
 const d=parse(mo),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),off=(d.getDay()+1)%7;
 const nm=(x)=>{const e=new Date(y,m+x,1);mo=iso(e);render()};
 window.nm=nm;
 let c='';for(let i=0;i<off;i++)c+='<div></div>';
 for(let i=1;i<=n;i++){const k=iso(new Date(y,m,i)),ts=dayTasks(k).filter(t=>t.st!=='cancelled').length,sc=k<=TODAY()?Math.round(score(k).tot*100)+'%':'';
  c+=`<button class="cell ${k===sel?'on':''}" onclick="sel='${k}';tl='day';render()">${i}<br>${ts?'● '+ts:'&nbsp;'}<br>${sc}</button>`}
 const hd=['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(x=>`<small style="text-align:center">${x}</small>`).join('');
 return `<div class="dbar"><button onclick="nm(1)">▶</button><b>${fmt(mo,{month:'long',year:'numeric'})}</b><button onclick="nm(-1)">◀</button></div><div class="wk" style="margin-bottom:4px">${hd}</div><div class="wk">${c}</div>`;
}
function monthQ(k){
 const d=parse(k),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate();let s=0,dd=0;
 for(let i=1;i<=n;i++){const q=pk(iso(new Date(y,m,i))).q||0;s+=q;if(q>=S.set.quran)dd++}
 return{s:s,dd:dd,n:n};
}
function setIn(key,lbl){return `<label>${lbl}<input type="number" min="1" value="${S.set[key]}" onchange="S.set['${key}']=Math.max(1,+this.value||1);save();render()"></label>`}
function vWorship(){
 const d=pk(sel),A=d.ad,mq=monthQ(sel),rem=Math.max(0,S.set.quran-d.q);
 const tg=(f,t)=>`<button class="${A[f]?'p':''}" onclick="togAd('${f}')">${A[f]?'✓ ':''}${t}</button>`;
 const ctr=(f,t,tg)=>`<div class="card" style="margin:10px 0 0">${bar(A[f]/S.set[tg],t+': '+A[f]+' من '+S.set[tg])}<div class="btns" style="margin-top:0"><button onclick="addAd('${f}',1)">+1</button><button onclick="addAd('${f}',10)">+10</button><button onclick="addAd('${f}',33)">+33</button><button class="d" onclick="addAd('${f}',-1)">-1</button></div></div>`;
 return `<div class="card"><h3>الصلوات الخمس</h3>${prayRow()}<small>اضغط لتغيير الحالة: في وقتها، متأخرة، فاتتني. يُسجَّل وقت الضغط تلقائيًا.</small></div>
 <div class="card"><h3>القرآن الكريم</h3>${bar(d.q/S.set.quran,'المقروء اليوم: '+d.q+' من '+S.set.quran+' صفحة')}<small>المتبقي اليوم: ${rem} صفحة</small>
 <div class="btns"><button onclick="addF('q',1)">+1</button><button onclick="addF('q',5)">+5</button><button onclick="addF('q',10)">+10</button><button class="d" onclick="addF('q',-1)">-1</button></div>
 <div style="height:10px"></div>${bar(mq.s/604,'الختمة الشهرية: '+mq.s+' من 604 صفحة')}<small>أيام تحقق فيها الهدف هذا الشهر: ${mq.dd} من ${mq.n}</small></div>
 <div class="card"><h3>الأذكار والأدعية</h3><div class="btns" style="margin-top:0">${tg('m','أذكار الصباح')}${tg('e','أذكار المساء')}${tg('d','الأدعية')}${tg('w','الوتر')}</div>${ctr('tas','التسبيح','tas')}${ctr('ist','الاستغفار','ist')}</div>
 <div class="card"><h3>الأهداف</h3><div class="g2">${setIn('quran','هدف القرآن (صفحات يوميًا)')}${setIn('tas','هدف التسبيح')}${setIn('ist','هدف الاستغفار')}</div></div>`;
}
function vHealth(){
 const d=pk(sel),ws=weekStart(sel);let wm=0;for(let i=0;i<7;i++){const x=pk(addD(ws,i));wm+=x.walk+x.run}
 const ex=(f,t)=>`<div class="btns"><span style="flex:1;align-self:center">${t}: ${d[f]} دقيقة</span><button onclick="addF('${f}',10)">+10</button><button class="d" onclick="addF('${f}',-10)">-10</button></div>`;
 return `<div class="card"><h3>الماء</h3>${bar(d.w/S.set.water,d.w+' من '+S.set.water+' مل')}<div class="btns"><button onclick="addF('w',250)">+ كوب 250</button><button onclick="addF('w',500)">+ 500</button><button class="d" onclick="addF('w',-250)">-250</button></div></div>
 <div class="card"><h3>الرياضة</h3>${bar((d.walk+d.run)/S.set.ex,'اليوم: '+(d.walk+d.run)+' من '+S.set.ex+' دقيقة')}${ex('walk','المشي')}${ex('run','الهرولة')}<div style="height:8px"></div>${bar(wm/(S.set.ex*7),'هذا الأسبوع (من السبت): '+wm+' دقيقة')}</div>
 <div class="card"><h3>الأهداف</h3><div class="g2">${setIn('water','هدف الماء اليومي (مل)')}${setIn('ex','هدف الرياضة اليومي (دقائق)')}</div></div>
 <div class="card"><small>قريبًا: النوم، المذاكرة، والكتب.</small></div>`;
}
/* actions */
function pray(id){const d=D(sel),o=['','ontime','late','missed'],c=d.pr[id]||'',n=o[(o.indexOf(c)+1)%4];
 if(n){d.pr[id]=n;const t=new Date();d.pr[id+'_t']=hm(t.getHours()*60+t.getMinutes())}else{delete d.pr[id];delete d.pr[id+'_t']}save();render()}
function addF(f,n){const d=D(sel);d[f]=Math.max(0,d[f]+n);save();render()}
function addAd(f,n){const d=D(sel);d.ad[f]=Math.max(0,d.ad[f]+n);save();render()}
function togAd(f){const d=D(sel);d.ad[f]=d.ad[f]?0:1;save();render()}
function tog(id){const t=S.tasks.find(x=>x.id===id);t.st=t.st==='done'?'todo':'done';(t.subs||[]).forEach(s=>s.done=t.st==='done');save();render()}
function subTog(id,i){const t=S.tasks.find(x=>x.id===id);t.subs[i].done=!t.subs[i].done;const n=t.subs.filter(s=>s.done).length;t.st=n===t.subs.length?'done':n?'doing':'todo';save();render()}
function moveTask(id,s,e){const t=S.tasks.find(x=>x.id===id);t.t1=hm(s);t.t2=hm(e);save();render()}
function blank(o){return Object.assign({id:'',title:'',desc:'',d1:'',d2:'',t1:'',t2:'',a1:'',a2:'',pr:'normal',st:'todo',ct:'personal',notes:'',link:'',subs:[],why:''},o||{})}
function qAdd(type){const v=$('#qa').value.trim();if(!v)return $('#qa').focus();
 if(type==='idea')S.ideas.unshift({id:uid(),text:v});else{const t=blank({id:uid(),title:v,d1:type==='today'?sel:''});S.tasks.push(t)}save();render()}
function ideaTo(id,type){const i=S.ideas.find(x=>x.id===id);S.tasks.push(blank({id:uid(),title:i.text,d1:type==='today'?sel:''}));S.ideas=S.ideas.filter(x=>x.id!==id);save();render()}
function ideaDel(id){S.ideas=S.ideas.filter(x=>x.id!==id);save();render()}
const opts=(o,v,f)=>Object.keys(o).map(k=>`<option value="${k}" ${k===v?'selected':''}>${f?f(o[k]):o[k]}</option>`).join('');
function closeM(){$('#modal').innerHTML=''}
function openTask(id){
 const t=id?S.tasks.find(x=>x.id===id):blank({d1:sel});
 const f=(n,l,ty)=>`<label>${l}<input type="${ty||'text'}" id="f_${n}" value="${esc(t[n])}"></label>`;
 $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>${id?'تعديل المهمة':'مهمة جديدة'}</h3>
 ${f('title','اسم المهمة')}<label>الوصف والتفاصيل<textarea id="f_desc">${esc(t.desc)}</textarea></label>
 <div class="g2">${f('d1','تاريخ البداية','date')}${f('d2','تاريخ النهاية','date')}${f('t1','وقت البداية','time')}${f('t2','وقت النهاية','time')}</div>
 <div class="g2"><label>الأولوية<select id="f_pr">${opts(PR,t.pr,x=>x[0])}</select></label><label>الحالة<select id="f_st">${opts(ST,t.st)}</select></label></div>
 <label>المجال<select id="f_ct">${opts(CT,t.ct)}</select></label>
 <label>سبب الإلغاء (عند الإلغاء)<input id="f_why" value="${esc(t.why)}"></label>
 <label>مهام فرعية (كل سطر مهمة)<textarea id="f_subs">${esc((t.subs||[]).map(s=>s.t).join('\n'))}</textarea></label>
 <div class="g2">${f('a1','الوقت الفعلي: من','time')}${f('a2','الوقت الفعلي: إلى','time')}</div>
 <label>ملاحظات<textarea id="f_notes">${esc(t.notes)}</textarea></label>${f('link','رابط (يبدأ بـ https://)')}
 <div class="btns"><button class="p" onclick="saveTask('${id||''}')">حفظ</button><button onclick="closeM()">إغلاق</button>${id?`<button class="d" onclick="delTask('${id}',this)">حذف</button>`:''}</div></div></div>`;
}
function saveTask(id){
 const g=x=>$('#f_'+x).value.trim();
 if(!g('title'))return $('#f_title').focus();
 const t=id?S.tasks.find(x=>x.id===id):{id:uid(),subs:[]},old=t.subs||[];
 Object.assign(t,{title:g('title'),desc:g('desc'),d1:g('d1'),d2:g('d2'),t1:g('t1'),t2:g('t2'),a1:g('a1'),a2:g('a2'),pr:g('pr'),st:g('st'),ct:g('ct'),notes:g('notes'),link:g('link'),why:g('why')});
 t.subs=g('subs').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({t:x,done:!!(old.find(o=>o.t===x)||{}).done}));
 if(!id)S.tasks.push(t);save();closeM();render();
}
function delTask(id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='اضغط مرة أخرى للتأكيد';return}S.tasks=S.tasks.filter(x=>x.id!==id);save();closeM();render()}
render();
</script>
</body>
</html>
